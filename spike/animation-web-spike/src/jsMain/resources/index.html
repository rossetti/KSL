<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KSL Animation — Phase S spike</title>
  <style>
    body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 16px;
           background: #fafafa; color: #222; }
    h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
    .sub { color: #777; margin-bottom: 12px; }
    #canvas { width: 900px; height: 540px; background: #fff; border: 1px solid #ddd; border-radius: 4px;
              display: block; }
    .controls { display: flex; align-items: center; gap: 10px; margin: 10px 0; width: 900px; }
    #scrub { flex: 1; }
    button, input[type=text] { font: inherit; padding: 4px 12px; border: 1px solid #ccc; border-radius: 4px;
                               background: #fff; cursor: pointer; }
    input[type=text] { cursor: text; width: 150px; }
    #status { color: #555; margin: 6px 0; }
    #metrics { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 12px;
               white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
               width: 900px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>KSL Animation — Phase S spike</h1>
  <div class="sub">Real <code>.atf</code> trace + <code>.lay.json</code> layout, replayed by the real
    <code>ReplayModel</code> and <code>PlaybackController</code> compiled to Kotlin/JS. Disposable.</div>

  <canvas id="canvas"></canvas>

  <div class="controls">
    <button id="play">Play</button>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <input type="text" id="trace" value="AnnotatedClinic">
    <button id="load">Load</button>
  </div>

  <div id="status">initialising…</div>
  <div id="metrics">—</div>

  <script src="spike.js"></script>
</body>
</html>
