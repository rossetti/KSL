# Safety-net CI: compile every module and run its tests on Java 21, so a broken
# change is caught before (PR) or right after (push) it reaches `main`, instead of
# only when someone next builds locally.
#
# Scope on purpose:
#   * Runs `./gradlew build` — compile + all module tests. It does NOT package the
#     distribution (`assembleKSLWork`/`packageKSLWork`) and needs NO git-ignored
#     `_book/`; book-content tests skip when it's absent. Publishing the release
#     stays a deliberate manual step (see docs/releasing-suite.md).
#   * One headless Linux runner: the suite is OS-independent (JARs + text launchers),
#     so one build verifies all platforms. Display-dependent plot/Swing tests are
#     guarded to skip headless; add a macOS/Windows matrix or xvfb later if wanted.
#   * `workflow_dispatch` lets you run it on a feature branch before merging.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
