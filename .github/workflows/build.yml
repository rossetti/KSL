# Safety-net CI: compile every module and run its tests on Java 21, so a broken
# change is caught before (PR) or right after (push) it reaches `main`, instead of
# only when someone next builds locally.
#
# Scope on purpose:
#   * Runs `./gradlew build` — compile + all module tests. It does NOT package the
#     distribution (`assembleKSLWork`/`packageKSLWork`) and needs NO git-ignored
#     `_book/`; book-content tests skip when it's absent. Publishing the release
#     stays a deliberate manual step (see docs/releasing-suite.md).
#   * One headless Linux runner: the suite is OS-independent (JARs + text launchers),
#     so one build verifies all platforms. Display-dependent plot/Swing tests are
#     guarded to skip headless; add a macOS/Windows matrix or xvfb later if wanted.
#   * `workflow_dispatch` lets you run it on a feature branch before merging.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  animation-web:
    # KSLAnimationCore compiles KSL's own animation sources a SECOND time, for Kotlin/JS, so a browser
    # can replay a .atf trace. It is a standalone build and is deliberately absent from the root
    # settings.gradle.kts, which is what keeps `./gradlew build` above free of Node.js, Yarn and any
    # network fetch. That exclusion has a cost: nothing in the main build would notice if a shared
    # source stopped being portable. This job is that notice.
    #
    # The break it exists to catch is asymmetric and easy to miss locally: adding a `java.*` import — or
    # a Kotlin stdlib member that only exists on the JVM, such as removeIf, toSortedMap, toSortedSet or
    # putIfAbsent — to a shared file compiles perfectly for the JVM and fails only here.
    #
    # Retired at Path A, when those sources move into the module for real and it joins the root build.
    name: animation web core (Kotlin/JS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # `check` runs the Kotlin/JS test suite in headless Chrome and asserts that every shared source is
      # free of JVM-only imports.
      - name: Compile and test the shared animation core for the web
        run: ./gradlew -p KSLAnimationCore check --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: animation-web-test-reports
          path: 'KSLAnimationCore/build/reports/tests/'
          retention-days: 7
