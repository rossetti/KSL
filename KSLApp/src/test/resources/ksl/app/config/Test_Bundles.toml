# Optional list of model-bundle JARs the scenarios reference.
# Omit entirely (or leave empty) when no scenario uses a bundle-
# backed model reference.  Each entry pins one bundleId and an
# ordered list of candidate filesystem paths the loader tries in
# order until one resolves.

[[bundleRefs]]
# List of candidate filesystem paths to try when resolving this
# bundle's JAR.  Tried in order; absolute, workspace-relative,
# or '~'-prefixed forms are all accepted.  May be empty when the
# bundle was originally dropped via a file picker — the consumer
# then falls back to bundleId-based discovery (Recent Bundles,
# ~/.ksl/bundles/) before prompting the user.
paths = [
    "/Users/rossetti/.ksl/bundles/book-examples.jar"
]
# String (required, non-blank). Authoritative identifier of the
# bundle JAR (KSLModelBundle.bundleId).  Scenarios reference
# this id via modelReference = { type = 'byBundleAndModelId',
# bundleId = '…', modelId = '…' }.
bundleId = "edu.uark.ksl.book-examples"

[[bundleRefs]]
# List of candidate filesystem paths to try when resolving this
# bundle's JAR.  Tried in order; absolute, workspace-relative,
# or '~'-prefixed forms are all accepted.  May be empty when the
# bundle was originally dropped via a file picker — the consumer
# then falls back to bundleId-based discovery (Recent Bundles,
# ~/.ksl/bundles/) before prompting the user.
paths = [
    "/Users/rossetti/.ksl/bundles/KSLExamples-1.0-SNAPSHOT.jar"
]
