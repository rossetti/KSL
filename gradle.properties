# Root build properties for the KSL multi-project build.
#
# IMPORTANT: Gradle reads `org.gradle.jvmargs` ONLY from the root project
# directory and ~/.gradle — NOT from subproject gradle.properties files. Without
# this file a fresh checkout (e.g. a CI runner) gets Gradle's ~512 MB default
# heap, which runs out of memory while compiling KSLCore. (Local builds happen to
# work because they pick up heap from ~/.gradle/gradle.properties, which is a
# per-machine file and never reaches CI.)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# The Kotlin compile daemon gets its own JVM; the CI OOM occurred here.
kotlin.daemon.jvmargs=-Xmx3g

# Reuse build outputs across runs (CI persists ~/.gradle via setup-java's cache).
org.gradle.caching=true

# Single source of truth for the server-stack version (KSLServiceCore + the REST
# and MCP servers). Stamped into those jars' manifests as Implementation-Version
# and reported by every server. Must be a non-SNAPSHOT value. Change it here only.
# (KSLCore keeps its own library release version.)
kslServerVersion=1.0.0

# Independent version for the KSL Code MCP server (the knowledge-search tool over the
# KSL API — separate from the server stack above). Stamped into ksl-code-mcp.jar's
# manifest and reported by get_server_info. Change it here only.
kslCodeMcpVersion=1.0.0

# Independent version for the KSL Book MCP server (serves KSL textbook content; a
# self-contained server with no KSLCore dependency). Stamped into ksl-book-mcp.jar's
# manifest as Implementation-Version. Change it here only.
kslBookMcpVersion=1.0.0

# Version of the whole installable suite (ksl-suite.zip: the apps + servers + kslpkg +
# shared lib/) — distinct from the component versions above; it names the bundled
# release as a whole. `stampSuiteManifest` writes it (with the zip's sha256) into
# manifest.json's suite block; -PreleaseVersion overrides it at release time.
kslSuiteVersion=0.1.0
